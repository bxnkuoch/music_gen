# The prompt grid for the pre-generated song pool (Phase 1).
#
# Every genre x mood x energy combination becomes one prompt (15 x 4 x 3 = 180),
# and each prompt is generated with `seeds_per_prompt` different seeds (x3 = 540 clips,
# about 12 s each on an M3). One instrument and one BPM are picked per prompt with a
# fixed random seed, so the grid is identical every time.
#
# Re-running scripts/generate_pool.py only ADDS new prompts; existing songs are kept.
#
# APPEND-ONLY: add new genres at the END of `genres`, and don't edit existing ones.
# Instruments/BPMs are drawn from one random stream in order, so inserting or editing
# an earlier genre changes every prompt after it, and those would all be re-generated.

random_seed: 42
seeds_per_prompt: 3
duration_s: 30

# genre -> instruments that suit it (one is picked per prompt)
genres:
  r&b: [warm rhodes piano, smooth electric bass, soft finger snaps]
  lo-fi hip hop: [dusty jazz piano, muted trumpet, vinyl crackle drums]
  synthwave: [retro analog synths, gated reverb drums, arpeggiated bass]
  heavy metal: [distorted electric guitars, double kick drums, growling bass]
  acoustic folk: [fingerpicked acoustic guitar, harmonica, upright bass]
  house: [four-on-the-floor kick, deep sub bass, filtered chords]
  jazz: [brushed drums, walking upright bass, saxophone]
  classical: [string quartet, solo piano, orchestral woodwinds]
  reggae: [offbeat guitar skank, deep dub bass, organ bubble]
  ambient: [evolving synth pads, granular textures, soft bells]
  # Added in Phase 2 from the listener's stated favourites (styles described, not named):
  lo-fi guitar: [plucked acoustic guitar, fingerpicked nylon guitar, mellow plucked electric guitar]
  pop: [bright synth chords, punchy drums, catchy piano hooks]
  hyperpop: [glitchy distorted synths, bitcrushed 808 bass, sparkly bell synths]
  anime soundtrack: [soaring electric guitar and strings, emotional piano and strings, bright j-pop synths]
  fantasy adventure video game: [ocarina and harp, orchestral strings and flute, 16-bit chiptune melody]

moods: [chill, dark, uplifting, melancholic]

# BPM ranges are sampled uniformly (integers); `words` go into the prompt text.
energy:
  low: {words: slow and relaxed, bpm: [65, 85]}
  medium: {words: steady mid-tempo groove, bpm: [90, 115]}
  high: {words: fast and energetic, bpm: [120, 150]}

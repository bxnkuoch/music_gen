[project]
name = "music-gen"
version = "0.1.0"
description = "Adaptive AI music system that learns one user's preferences from pairwise feedback."
authors = [
    { email = "benjaminkuoch@gmail.com" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "accelerate>=1.12",
    "alembic>=1.14",
    "diffusers>=0.40.0",
    "fastapi>=0.115",
    "huggingface-hub>=0.34",
    "librosa>=1.0",
    "numpy>=2.0",
    "pgvector>=0.4",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.10",
    "pyyaml>=6.0",
    "scikit-learn>=1.5",
    "soundfile>=0.13",
    "sqlalchemy>=2.0",
    "torch>=2.9",
    "transformers>=4.57",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
# MuQ-MuLan weights are CC BY-NC 4.0: research/evaluation use only (see README "Licenses").
muq = ["muq>=0.1.0"]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8.4",
    "ruff>=0.13",
]

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
markers = [
    "slow: loads real pretrained models (multi-GB downloads); run with `pytest -m slow`",
]
addopts = "-m 'not slow'"

[tool.ruff]
line-length = 100
extend-exclude = ["scripts/third_party"]  # vendored, kept byte-identical to upstream

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-third-party = ["alembic"]  # not our local alembic/ migrations folder
